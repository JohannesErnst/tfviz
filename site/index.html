<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TFviz - TF frame viewer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📐</text></svg>">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <aside id="panel">
    <h1>TFviz - TF frame viewer</h1>
    <p class="hint">The coordinate transformation was performed using the intrinsic transformation. </p>

    <div class="toolbar">
      <label>Angles in
        <select id="unit">
          <option value="deg">degrees</option>
          <option value="rad">radians</option>
        </select>
      </label>
      <label class="size-control" for="frame-size">Frame size
        <input id="frame-size" type="range" min="0.1" max="1" step="0.1" value="0.8">
        <output id="frame-size-value" for="frame-size">0.8</output>
      </label>
      <button id="reset" type="button">Reset</button>
    </div>

    <section id="f1"></section>
    <section id="f2"></section>

    <section>
      <h2>Frame 2 in the world frame</h2>
      <pre id="result"></pre>
    </section>
  </aside>
  <main id="view"></main>
  <script type="module" src="app.js"></script>
</body>
</html>
